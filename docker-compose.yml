services:
  postgres:
    image: postgres:16-alpine
    container_name: atletatrack_postgres
    environment:
      POSTGRES_USER: atletatrack
      POSTGRES_PASSWORD: atletatrack
      POSTGRES_DB: atletatrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atletatrack -d atletatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: atletatrack_backend
    environment:
      DATABASE_URL: postgresql://atletatrack:atletatrack@postgres:5432/atletatrack?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  frontend:
    build: ./frontend
    container_name: atletatrack_frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
